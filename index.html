<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Monitor de Vehículo en Tiempo Real — Control Room</title>
    <meta
      name="description"
      content="Monitor en tiempo real de flota vehicular sobre la API de Traccar: estado de conexión, velocidad, ubicación y mapa interactivo."
    />
    <meta name="theme-color" content="#0E1210" />

    <!-- Fija el tema ANTES del primer paint (AD-8) para evitar parpadeo (FOUC).
         Vive fuera del bundle de React a propósito: React monta después del
         primer pintado y no puede evitar el FOUC por sí solo. -->
    <script>
      (function () {
        try {
          // Oscuro es el modo por defecto de la marca (Assets/desktop1.png,
          // desktop2.png, movilResponsive*.png son todas oscuras) -- se
          // respeta la elección GUARDADA del usuario si ya cambió el tema
          // una vez, pero la primera visita NUNCA se decide por
          // prefers-color-scheme del sistema operativo. Antes sí lo hacía:
          // en un equipo con tema claro del sistema, la app arrancaba en
          // claro sin que el usuario lo pidiera, lo que -- combinado con el
          // toggle -- podía sentirse como "el icono de tema no cambia" (en
          // realidad arrancaba en el estado opuesto al esperado).
          var stored = localStorage.getItem("traccar-monitor:theme");
          var theme = stored === "light" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
